<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TikTok Lead Collector</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>TikTok Lead Collector</h1>

      <label>
        Backend URL
        <input id="apiBaseUrl" type="url" placeholder="http://localhost:3000">
      </label>

      <div class="grid">
        <label>
          Min followers
          <input id="minFollowers" type="number" min="0" step="100">
        </label>
        <label>
          Max followers
          <input id="maxFollowers" type="number" min="0" step="100">
        </label>
      </div>

      <label>
        Daily goal
        <input id="dailyGoal" type="number" min="1" step="1">
      </label>

      <label class="toggle">
        <input id="autoSkipOutOfRange" type="checkbox">
        <span>Auto Scroll Not Qualified</span>
      </label>

      <label class="toggle">
        <input id="autoSave" type="checkbox">
        <span>Auto Save Mode</span>
      </label>

      <label class="toggle">
        <input id="compactMode" type="checkbox">
        <span>Compact Mode</span>
      </label>

      <section class="settings-section">
        <h2>Approval Review</h2>

        <label class="toggle">
          <input id="approvalMode" type="checkbox">
          <span>Approval Mode</span>
        </label>

        <label>
          Approval Google Sheet URL
          <input id="approvalSheetUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/...">
        </label>

        <label>
          Source tab name optional
          <input id="approvalSourceSheet" type="text" placeholder="Leave blank to use URL gid / first tab">
        </label>

        <label>
          Link column
          <input id="approvalLinkColumn" type="text" placeholder="A or TikTok URL">
        </label>

        <label>
          Google account / reviewer Gmail
          <input id="reviewerEmail" type="email" placeholder="name@gmail.com">
        </label>
      </section>

      <button id="save">Save Settings</button>
      <p id="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
